<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Sedang Maintenance</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap');

        :root {
            --glass-base: rgba(20, 20, 30, 0.4);
            --glass-surface: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-refraction: rgba(255, 255, 255, 0.25);
            --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 3px rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-sub: #A1A1AA;
            --glass-blur: blur(12px) saturate(150%);
            --font-main: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        @keyframes liquidFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatEffect {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: #030305; color: var(--text-main); font-family: var(--font-main);
            overflow: hidden; display: flex; flex-direction: column;
            background: linear-gradient(135deg, #050510 0%, #021020 50%, #000000 100%);
            background-size: 200% 200%;
            animation: liquidFlow 15s ease infinite;
        }

        #viewport {
            flex: 1; position: relative; display: flex;
            align-items: center; justify-content: center;
            background: radial-gradient(circle at top, #1a1a24 0%, #000 100%);
            padding: 20px;
        }

        .screen-card {
            position: relative;
            z-index: 10;
            max-width: 450px;
            width: 100%;
            padding: 40px 30px;
            background: var(--glass-base);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 28px;
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-refraction);
            text-align: center;
            box-shadow: var(--glass-shadow);
            animation: floatEffect 6s ease-in-out infinite;
        }

        .icon-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-surface);
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-refraction);
            box-shadow: inset 0 2px 10px rgba(255,255,255,0.05);
        }

        .icon-container svg {
            width: 40px;
            height: 40px;
            stroke: var(--text-main);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            margin: 0 0 12px 0;
        }

        .dev-badge {
            display: inline-block;
            margin-bottom: 24px;
            padding: 6px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }

        .description {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-sub);
            margin: 0 0 32px 0;
            font-weight: 400;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-refraction);
            border-radius: 16px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: var(--glass-shadow);
        }

        .cta-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .cta-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        .cta-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

    </style>
</head>
<body>
    <div id="viewport">
        <div class="screen-card">
            <!-- SVG Icon (Tools/Maintenance) -->
            <div class="icon-container">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 9.36l-7.1 7.1a1 1 0 0 1-1.4 0l-2.8-2.8a1 1 0 0 1 0-1.4l7.1-7.1a6 6 0 0 1 9.36-7.94l-3.77 3.77z"></path>
                </svg>
            </div>
            
            <h1 class="title">Sistem Dinonaktifkan</h1>
            
            <div class="dev-badge">
                💻 Oleh: Mahyu Herdi Developer
            </div>
            
            <p class="description">
                Akses menuju sistem ini saat ini sedang dalam perbaikan atau nonaktif. Silakan hubungi developer untuk informasi lebih lanjut.
            </p>
            
            <a href="https://wa.me/" target="_blank" class="cta-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
                Hubungi Developer
            </a>
        </div>
    </div>
</body>
</html>
